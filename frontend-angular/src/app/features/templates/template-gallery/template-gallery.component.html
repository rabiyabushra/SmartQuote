<div class="template-gallery-container">
  <div class="header">
    <h1>Quotation Templates</h1>
    <p class="subtitle">Choose a template to create your quotation</p>
  </div>

  <div class="templates-grid" *ngIf="!isLoading(); else loading">
    <mat-card *ngFor="let template of templates()" class="template-card">
      <div class="template-thumbnail">
        <img [src]="getTemplateThumbnail(template.id)" 
             [alt]="template.name"
             (error)="$any($event.target).src='assets/templates/default-thumb.png'">
      </div>
      
      <mat-card-content>
        <h3>{{ template.name }}</h3>
        <p class="template-description" *ngIf="template.description">
          {{ template.description }}
        </p>
        <p class="template-category" *ngIf="template.category">
          <mat-icon>category</mat-icon>
          {{ template.category }}
        </p>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button color="primary" (click)="onPreviewTemplate(template)">
          <mat-icon>visibility</mat-icon>
          Preview
        </button>
        <button mat-raised-button color="primary" (click)="onSelectTemplate(template)">
          <mat-icon>add</mat-icon>
          Use Template
        </button>
      </mat-card-actions>
    </mat-card>

    <!-- No Templates Message -->
    <div class="no-templates" *ngIf="templates().length === 0">
      <mat-icon>description</mat-icon>
      <p>No templates available</p>
      <p class="subtitle">Contact your administrator to add templates</p>
    </div>
  </div>

  <ng-template #loading>
    <div class="loading-container">
      <mat-spinner diameter="50"></mat-spinner>
      <p>Loading templates...</p>
    </div>
  </ng-template>
</div>
