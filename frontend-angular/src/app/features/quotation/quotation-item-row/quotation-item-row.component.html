<div class="item-row">
  <div class="item-row__line">#{{ lineNumber }}</div>

  <div class="item-row__field-group item-row__field-group--description">
    <mat-form-field appearance="outline" class="item-row__field">
      <mat-label>Description</mat-label>
      <input
        matInput
        name="itemDescription-{{ lineNumber }}"
        [(ngModel)]="itemDescription"
        [disabled]="disabled"
        (ngModelChange)="emitChange()"
        placeholder="Item description"
      />
    </mat-form-field>
    <app-mic-button
      [quotationId]="quotationId"
      fieldName="itemDescription"
      fieldType="text"
      [disabled]="disabled"
      ariaLabel="Record item description"
      (recognized)="onDescriptionVoice($event)"
      (voiceError)="onVoiceError('description', $event)"
    ></app-mic-button>
    @if (descriptionError) {
      <p class="item-row__error">{{ descriptionError }}</p>
    }
  </div>

  <div class="item-row__field-group">
    <mat-form-field appearance="outline" class="item-row__field">
      <mat-label>Qty</mat-label>
      <input
        matInput
        type="number"
        min="0"
        step="1"
        name="quantity-{{ lineNumber }}"
        [(ngModel)]="quantity"
        [disabled]="disabled"
        (ngModelChange)="emitChange()"
      />
    </mat-form-field>
    <app-mic-button
      [quotationId]="quotationId"
      fieldName="quantity"
      fieldType="number"
      [disabled]="disabled"
      ariaLabel="Record quantity"
      (recognized)="onQuantityVoice($event)"
      (voiceError)="onVoiceError('quantity', $event)"
    ></app-mic-button>
    @if (quantityError) {
      <p class="item-row__error">{{ quantityError }}</p>
    }
  </div>

  <div class="item-row__field-group">
    <mat-form-field appearance="outline" class="item-row__field">
      <mat-label>Rate</mat-label>
      <input
        matInput
        type="number"
        min="0"
        step="0.01"
        name="rate-{{ lineNumber }}"
        [(ngModel)]="rate"
        [disabled]="disabled"
        (ngModelChange)="emitChange()"
      />
    </mat-form-field>
    <app-mic-button
      [quotationId]="quotationId"
      fieldName="rate"
      fieldType="number"
      [disabled]="disabled"
      ariaLabel="Record rate or amount"
      (recognized)="onRateVoice($event)"
      (voiceError)="onVoiceError('rate', $event)"
    ></app-mic-button>
    @if (rateError) {
      <p class="item-row__error">{{ rateError }}</p>
    }
  </div>

  @if (removable) {
    <button
      type="button"
      mat-icon-button
      class="item-row__remove"
      [disabled]="disabled"
      aria-label="Remove item row"
      (click)="onRemove()"
    >
      <mat-icon>delete_outline</mat-icon>
    </button>
  }
</div>
