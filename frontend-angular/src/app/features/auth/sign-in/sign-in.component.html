<div class="sign-in-page">
  <mat-card class="sign-in-card">

    <!-- Brand header -->
    <div class="brand">
      <mat-icon class="brand-icon">assignment</mat-icon>
      <div class="brand-text">
        <span class="brand-name">Smart Quotation Builder</span>
        <span class="brand-tagline">Welcome back to your account</span>
      </div>
    </div>

    <!-- Sign-in panel -->
    <div class="sign-in-panel">
      <h1 class="title">SIGN IN</h1>

      <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="form">


        <mat-form-field appearance="outline" class="full-width">
          <mat-label class="field-label">Email</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            autocomplete="email" />
          <mat-error *ngIf="signInForm.get('email')?.hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="signInForm.get('email')?.hasError('email')">
            Enter a valid email address
          </mat-error>
        </mat-form-field>

        <label class="field-label">Password</label>
        <mat-form-field appearance="outline" class="full-width">
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password" />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="!hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="signInForm.get('password')?.hasError('required')">
            Password is required
          </mat-error>
          <mat-error *ngIf="signInForm.get('password')?.hasError('minlength')">
            Password must be at least 6 characters
          </mat-error>
        </mat-form-field>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="full-width submit-btn"
          [disabled]="isLoading">
          <mat-spinner *ngIf="isLoading" diameter="20" class="btn-spinner"></mat-spinner>
          <span *ngIf="!isLoading">SIGN IN</span>
        </button>

        <a routerLink="/auth/forgot-password" class="forgot-link">Forgot Password?</a>
      </form>

      <div class="divider">
        <span class="line"></span>
        <span class="divider-text">OR</span>
        <span class="line"></span>
      </div>

      <div class="footer-links">
        Don't have an account?
        <a routerLink="/auth/sign-up" class="create-account-link">CREATE ACCOUNT</a>
      </div>
    </div>
  </mat-card>
</div>
