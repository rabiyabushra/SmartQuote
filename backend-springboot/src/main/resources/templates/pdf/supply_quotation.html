<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${quotation.quotationNumber}">Quotation</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; color: #222; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
        th { background: #f5f5f5; }
        .totals { margin-top: 16px; width: 40%; margin-left: auto; }
        .meta { margin: 8px 0; }
    </style>
</head>
<body>
<div th:utext="${headerHtml}"></div>

<div class="meta">
    <div><strong>Quotation No:</strong> <span th:text="${quotation.quotationNumber}"></span></div>
    <div><strong>Date:</strong> <span th:text="${quotation.quotationDate}"></span></div>
    <div><strong>Customer:</strong> <span th:text="${contact.companyName}"></span></div>
    <div><strong>Generated:</strong> <span th:text="${generatedOn}"></span></div>
</div>

<table>
    <thead>
    <tr>
        <th>#</th>
        <th>Description</th>
        <th>HSN/SAC</th>
        <th>Qty</th>
        <th>Unit</th>
        <th>Rate</th>
        <th>Amount</th>
        <th>Tax</th>
        <th>Total</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item, stat : ${items}">
        <td th:text="${stat.count}"></td>
        <td th:text="${item.itemDescription}"></td>
        <td th:text="${item.hsnSacCode}"></td>
        <td th:text="${item.quantity}"></td>
        <td th:text="${item.unit}"></td>
        <td th:text="${item.rate}"></td>
        <td th:text="${item.amount}"></td>
        <td th:text="${item.taxAmount}"></td>
        <td th:text="${item.totalAmount}"></td>
    </tr>
    </tbody>
</table>

<table class="totals">
    <tr><td>Subtotal</td><td th:text="${quotation.subtotal}"></td></tr>
    <tr th:if="${quotation.discountAmount != null and quotation.discountAmount > 0}">
        <td>Discount</td><td th:text="${quotation.discountAmount}"></td>
    </tr>
    <tr th:if="${quotation.cgstAmount != null and quotation.cgstAmount > 0}">
        <td>CGST</td><td th:text="${quotation.cgstAmount}"></td>
    </tr>
    <tr th:if="${quotation.sgstAmount != null and quotation.sgstAmount > 0}">
        <td>SGST</td><td th:text="${quotation.sgstAmount}"></td>
    </tr>
    <tr th:if="${quotation.igstAmount != null and quotation.igstAmount > 0}">
        <td>IGST</td><td th:text="${quotation.igstAmount}"></td>
    </tr>
    <tr><td><strong>Grand Total</strong></td><td><strong th:text="${quotation.grandTotal}"></strong></td></tr>
</table>

<div th:if="${bankDetails != null}" style="margin-top: 24px;">
    <strong>Bank Details</strong>
    <div th:text="${bankDetails.accountHolderName}"></div>
    <div th:text="${bankDetails.bankName} + ' - ' + ${bankDetails.branchName}"></div>
    <div>A/C: <span th:text="${bankDetails.accountNumber}"></span></div>
    <div>IFSC: <span th:text="${bankDetails.ifscCode}"></span></div>
</div>

<div th:utext="${footerHtml}"></div>
</body>
</html>
